name: CI
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check app tests scripts frontend alembic
      - run: ruff format --check app tests scripts frontend alembic
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/voice_browser_checks.cjs
      - run: pytest -q
      - run: python -m scripts.evaluate
      - run: python -m scripts.evaluate_retrieval
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: policy-evaluation
          path: .local/evaluations/*.json
          if-no-files-found: ignore
      - run: python -m compileall -q app scripts frontend
  postgres-concurrency:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: supportflow_test
          POSTGRES_USER: supportflow_test
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supportflow_test -d supportflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SUPPORTFLOW_TEST_DATABASE_URL: postgresql+asyncpg://supportflow_test:test-only-password@localhost:5432/supportflow_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest tests/test_postgres_concurrency.py --postgres -q
