
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "supportflow-ai"
version = "0.1.0"
description = "Production-minded agentic customer support demo"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pwdlib[argon2]>=0.3,<1",
    "PyJWT[crypto]>=2.10,<3",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic-settings>=2.5,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.29,<1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.13,<2",
    "langgraph>=0.2.60,<2",
    "langgraph-checkpoint-postgres>=2.0,<4",
    "langchain-groq>=0.2,<2",
    "langchain-core>=0.3,<2",
    "chromadb>=0.5,<2",
    "sentence-transformers>=3,<6",
    "httpx>=0.27,<1",
    "streamlit>=1.39,<2"
]

[project.optional-dependencies]
mcp = ["mcp[cli]>=1.28,<2"]
models = ["langchain-ollama>=1,<2", "langchain-openai>=1,<2"]
tracing = ["opentelemetry-sdk>=1.30,<2", "opentelemetry-exporter-otlp-proto-http>=1.30,<2"]
voice = [
    "faster-whisper>=1.1,<2",
    "piper-tts>=1.3,<2",
    "silero-vad>=6,<7",
    "numpy>=1.26,<3"
]
dev = [
    "langchain-ollama>=1,<2",
    "langchain-openai>=1,<2",
    "mcp>=1.28,<2",
    "opentelemetry-sdk>=1.30,<2",
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.7,<1"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*", "data*", "frontend*", "alembic*"]

[tool.setuptools.package-data]
"app.voice" = ["web/*.html", "web/*.js"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
