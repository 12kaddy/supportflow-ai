services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: supportflow
      POSTGRES_USER: supportflow
      POSTGRES_PASSWORD: supportflow
    ports:  
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supportflow -d supportflow"]
      interval: 5s
      retries: 10
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://supportflow:supportflow@db:5432/supportflow
      CHECKPOINT_DATABASE_URL: postgresql://supportflow:supportflow@db:5432/supportflow
    ports:
      - "8000:8000"
    volumes:
      - chromadata:/code/.local
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && python -m scripts.seed && python -m scripts.ingest && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
volumes:
  pgdata:
  chromadata:
